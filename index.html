<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodas de Ouro - 50 Anos de União</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #fcf8f2;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .convite-container {
            background-color: #ffffff;
            border: 8px double #d4af37;
            border-radius: 15px;
            padding: 40px 30px;
            width: 90%;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h1 {
            color: #b59410;
            font-size: 2.6em;
            margin-bottom: 5px;
            font-weight: normal;
        }

        .subtitulo {
            color: #666;
            font-size: 1.3em;
            font-style: italic;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* --- FOTOS PRINCIPAIS --- */
        .fotos-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .foto-bloco {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .foto-moldura {
            width: 160px;
            height: 160px;
            border-radius: 12px;
            border: 4px solid #d4af37;
            overflow: hidden;
            background-color: #f2f2f2;
        }

        .foto-moldura img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        .foto-legenda {
            margin-top: 10px;
            font-size: 1.05em;
            color: #b59410;
            font-weight: bold;
        }

        .texto-convite {
            color: #444;
            font-size: 1.15em;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* --- FORMULÁRIO --- */
        #partyForm {
            border-top: 2px dashed #d4af37;
            padding-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .campo-grupo {
            width: 100%;
            max-width: 380px;
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(45deg, #25D366, #1eb954);
            color: white;
            border: none;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- TABELA DE CONFIRMADOS NO CÓDIGO --- */
        .tabela-container {
            margin-top: 30px;
            width: 100%;
            text-align: left;
        }

        .tabela-container h4 {
            color: #b59410;
            margin-bottom: 10px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ebd9a2;
            padding: 8px 12px;
            text-align: left;
            font-size: 0.95em;
        }

        th {
            background-color: #faf6ed;
            color: #b59410;
        }
    </style>
</head>
<body>

<div class="convite-container">
    <h1>Bodas de Ouro</h1>
    <p class="subtitulo">50 Anos de Amor, Cumplicidade e História</p>

    <div class="fotos-container">
        <div class="foto-bloco">
            <div class="foto-moldura">
                <img src="casamento_antigo.jpg" alt="Foto Antiga">
            </div>
            <span class="foto-legenda">O Início</span>
        </div>
        <div class="foto-bloco">
            <div class="foto-moldura">
                <img src="foto_atual.jpg" alt="Foto Atual">
            </div>
            <span class="foto-legenda">50 Anos Depois</span>
        </div>
    </div>

    <div class="texto-convite">
        <p>Gostaríamos muito de compartilhar essa emoção e celebrar esta grande conquista ao lado das pessoas que amamos!</p>
    </div>

    <!-- FORMULÁRIO -->
    <form id="partyForm">
        <h3>Confirme sua Presença</h3>
        
        <div class="campo-grupo">
            <label for="nome">Seu Nome:</label>
            <input type="text" id="nome" required placeholder="Digite seu nome completo">
        </div>

        <div class="campo-grupo">
            <label for="acompanhantes">Quantas pessoas vão com você?</label>
            <input type="number" id="acompanhantes" min="0" value="0" required>
        </div>

        <button type="button" onclick="confirmarEEnviar()">Confirmar Presença no WhatsApp</button>
    </form>

    <!-- TABELA ONDE OS NOMES FICAM REGISTRADOS -->
    <div class="tabela-container">
        <h4>📋 Lista de Confirmações</h4>
        <table id="tabelaPresenca">
            <thead>
                <tr>
                    <th>Nome do Convidado</th>
                    <th>Acompanhantes</th>
                </tr>
            </thead>
            <tbody>
                <!-- Os nomes aparecem aqui automaticamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
// Carrega a tabela assim que a página abre
document.addEventListener("DOMContentLoaded", carregarTabela);

function confirmarEEnviar() {
    const meuNumero = "5511999999999"; // Coloque seu número aqui
    const nome = document.getElementById("nome").value;
    const acompanhantes = document.getElementById("acompanhantes").value;

    if (!nome) {
        alert("Por favor, preencha o seu nome.");
        return;
    }

    // 1. Salva no banco de dados local da página (LocalStorage)
    let lista = JSON.parse(localStorage.getItem("listaBodas")) || [];
    lista.push({ nome: nome, acompanhantes: acompanhantes });
    localStorage.setItem("listaBodas", JSON.stringify(lista));

    // 2. Atualiza a tabela na tela
    carregarTabela();

    // 3. Monta a mensagem organizada para o seu WhatsApp
    const mensagem = `*CONFIRMAÇÃO BODAS DE OURO*%0A%0A👤 *Nome:* ${encodeURIComponent(nome)}%0A👥 *Acompanhantes:* ${encodeURIComponent(acompanhantes)}`;
    
    const url = `https://wa.me/${meuNumero}?text=${mensagem}`;
    window.open(url, "_blank");
}

function carregarTabela() {
    const tbody = document.querySelector("#tabelaPresenca tbody");
    tbody.innerHTML = ""; // Limpa a tabela antes de recarregar

    let lista = JSON.parse(localStorage.getItem("listaBodas")) || [];

    lista.forEach(item => {
        let tr = document.createElement("tr");
        tr.innerHTML = `<td>${item.nome}</td><td>${item.acompanhantes}</td>`;
        tbody.appendChild(tr);
    });
}
</script>

</body>
</html>
